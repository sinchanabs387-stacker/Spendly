<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly - Personal Finance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .serif-quote { font-family: 'Playfair Display', serif; }
    .bg-spendly { background-color: #95C992; }
    .hover-bg-spendly:hover { background-color: #82b87f; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logo -->
        <svg class="w-12 h-12" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="#95C992" />
          <text x="50" y="58" font-family="'Times New Roman', serif" font-weight="900" font-size="20" fill="black" text-anchor="middle" letter-spacing="0.5">SPENDLY</text>
        </svg>
        <div>
          <p class="serif-quote text-slate-700 italic text-base md:text-lg font-semibold">"A penny saved is a penny earned"</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span id="userBadge" class="text-xs font-light text-slate-500 hidden md:inline">Profile: Demo User</span>
        <button onclick="toggleAuthModal()" class="bg-spendly hover-bg-spendly text-black font-extrabold px-4 py-2 rounded-lg text-sm transition">Switch Account</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full grow space-y-6">
    <!-- Top Actions & Summary -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- Total Received Card -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Received</span>
        <h2 id="totalReceived" class="text-3xl font-extrabold text-emerald-600 mt-2">₹0.00</h2>
        <span class="text-xs font-light text-slate-400 mt-2">All incoming cashflow</span>
      </div>

      <!-- Total Spent Card -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Spent</span>
        <h2 id="totalSpent" class="text-3xl font-extrabold text-rose-600 mt-2">₹0.00</h2>
        <span class="text-xs font-light text-slate-400 mt-2">All outgoing expenditures</span>
      </div>

      <!-- Quick Action Buttons -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-center space-y-3">
        <button onclick="openModal('received')" class="w-full bg-spendly hover-bg-spendly text-black font-extrabold py-3 px-4 rounded-lg text-sm transition flex items-center justify-center space-x-2">
          <span>+ Add Total Received</span>
        </button>
        <button onclick="openModal('spent')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-3 px-4 rounded-lg text-sm transition flex items-center justify-center space-x-2">
          <span>- Add Total Spent</span>
        </button>
      </div>
    </div>

    <!-- Expense Category Pie Chart -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <h3 class="text-lg font-extrabold text-slate-800 mb-4">Spending Breakdown by Category</h3>
      <div class="relative max-w-md mx-auto h-64">
        <canvas id="categoryPieChart"></canvas>
      </div>
    </div>

    <!-- Separate Transaction Details Section -->
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <h3 class="text-xl font-extrabold text-slate-900">Transaction Details</h3>
          <p class="text-xs font-light text-slate-500">History of all recorded entries</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <input type="text" id="searchInput" oninput="render()" placeholder="Search transactions..." class="border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-light focus:outline-none focus:border-emerald-500">
          <select id="filterType" onchange="render()" class="border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-light focus:outline-none">
            <option value="all">All Types</option>
            <option value="received">Total Received</option>
            <option value="spent">Total Spent</option>
          </select>
        </div>
      </div>

      <!-- Transactions Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-xs font-bold text-slate-400 uppercase tracking-wider">
              <th class="py-3 px-2">Date</th>
              <th class="py-3 px-2">Description</th>
              <th class="py-3 px-2">Category</th>
              <th class="py-3 px-2">Type</th>
              <th class="py-3 px-2 text-right">Amount</th>
              <th class="py-3 px-2 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="transactionList" class="divide-y divide-slate-100 text-sm font-light text-slate-600">
            <!-- Dynamic items load here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Component -->
  <div id="entryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <h3 id="modalTitle" class="text-xl font-extrabold text-slate-900">Add Entry</h3>
      <form id="entryForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="entryType">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Title / Description</label>
          <input type="text" id="entryTitle" required placeholder="e.g., Monthly Salary, Groceries" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-light focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Amount (₹)</label>
          <input type="number" step="0.01" id="entryAmount" required placeholder="0.00" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-light focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Category</label>
          <select id="entryCategory" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-light focus:outline-none">
            <option value="General">General</option>
            <option value="Food & Dining">Food & Dining</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills & Utilities">Bills & Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Salary">Salary</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-bold text-slate-500 hover:text-slate-800">Cancel</button>
          <button type="submit" class="bg-spendly hover-bg-spendly text-black font-extrabold px-4 py-2 rounded-lg text-sm transition">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('spendly_txs')) || [
      { id: 1, title: 'Initial Balance', amount: 5000, type: 'received', category: 'Salary', date: '2026-03-01' },
      { id: 2, title: 'Groceries', amount: 450, type: 'spent', category: 'Food & Dining', date: '2026-03-02' },
      { id: 3, title: 'Electricity Bill', amount: 1200, type: 'spent', category: 'Bills & Utilities', date: '2026-03-03' }
    ];

    let pieChartInstance = null;

    function saveAndRender() {
      localStorage.setItem('spendly_txs', JSON.stringify(transactions));
      render();
    }

    function render() {
      const list = document.getElementById('transactionList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('filterType').value;

      let totalReceived = 0;
      let totalSpent = 0;
      const categories = {};

      list.innerHTML = '';

      transactions.forEach(tx => {
        if (tx.type === 'received') totalReceived += tx.amount;
        if (tx.type === 'spent') {
          totalSpent += tx.amount;
          categories[tx.category] = (categories[tx.category] || 0) + tx.amount;
        }

        const matchesSearch = tx.title.toLowerCase().includes(search) || tx.category.toLowerCase().includes(search);
        const matchesFilter = filter === 'all' || tx.type === filter;

        if (matchesSearch && matchesFilter) {
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-50 transition';
          row.innerHTML = `
            <td class="py-3 px-2">${tx.date}</td>
            <td class="py-3 px-2 font-medium text-slate-800">${tx.title}</td>
            <td class="py-3 px-2"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-xs font-normal">${tx.category}</span></td>
            <td class="py-3 px-2 font-bold ${tx.type === 'received' ? 'text-emerald-600' : 'text-rose-600'}">${tx.type === 'received' ? 'Received' : 'Spent'}</td>
            <td class="py-3 px-2 text-right font-semibold">₹${tx.amount.toFixed(2)}</td>
            <td class="py-3 px-2 text-center">
              <button onclick="deleteTx(${tx.id})" class="text-slate-400 hover:text-rose-500 font-bold transition">×</button>
            </td>
          `;
          list.appendChild(row);
        }
      });

      document.getElementById('totalReceived').innerText = `₹${totalReceived.toFixed(2)}`;
      document.getElementById('totalSpent').innerText = `₹${totalSpent.toFixed(2)}`;

      updatePieChart(categories);
    }

    function updatePieChart(categoryData) {
      const ctx = document.getElementById('categoryPieChart').getContext('2d');
      const labels = Object.keys(categoryData);
      const data = Object.values(categoryData);

      if (pieChartInstance) pieChartInstance.destroy();

      pieChartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels.length ? labels : ['No Expenses'],
          datasets: [{
            data: data.length ? data : [1],
            backgroundColor: labels.length ? ['#95C992', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'] : ['#e2e8f0']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    function openModal(type) {
      document.getElementById('entryType').value = type;
      document.getElementById('modalTitle').innerText = type === 'received' ? 'Add Total Received' : 'Add Total Spent';
      document.getElementById('entryModal').classList.remove('hidden');
      document.getElementById('entryModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('entryModal').classList.add('hidden');
      document.getElementById('entryModal').classList.remove('flex');
      document.getElementById('entryForm').reset();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('entryType').value;
      const title = document.getElementById('entryTitle').value;
      const amount = parseFloat(document.getElementById('entryAmount').value);
      const category = document.getElementById('entryCategory').value;

      transactions.unshift({
        id: Date.now(),
        title,
        amount,
        type,
        category,
        date: new Date().toISOString().split('T')[0]
      });

      saveAndRender();
      closeModal();
    }

    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveAndRender();
    }

    render();
  </script>
</body>
</html>
